<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prompty</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Prompty</h1>
    <p class="sub">Power-user tools for claude.ai</p>
  </header>
  <main id="toggles">
    <label><input type="checkbox" data-key="branchCompose">
      <span><strong>Branch compose</strong><small>Write branches in the main composer</small></span></label>
    <label><input type="checkbox" data-key="treePanel">
      <span><strong>Prompty panel</strong><small>Conversation history &amp; branch navigation</small></span></label>
    <label><input type="checkbox" data-key="notes">
      <span><strong>Notes</strong><small>Highlight text → margin Q&amp;A, hidden in-thread</small></span></label>
    <label><input type="checkbox" data-key="comments">
      <span><strong>Comments</strong><small>Hover → position-anchored margin notes</small></span></label>
    <label><input type="checkbox" data-key="replies">
      <span><strong>Reply references</strong><small>Quoted replies link back to their source</small></span></label>
    <label><input type="checkbox" data-key="draftAutosave">
      <span><strong>Draft autosave</strong><small>Never lose a composer draft on reload</small></span></label>
  </main>
  <footer>
    Personal use only. Uses claude.ai's undocumented internal API and may
    break after site updates — see the README for troubleshooting.
  </footer>
  <script src="popup.js"></script>
</body>
</html>
